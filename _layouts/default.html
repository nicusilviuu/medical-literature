<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_newlines | truncate: 200 }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#129516;</text></svg>">
</head>
<body>
<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <p class="site-tagline">{{ site.tagline }}</p>
</header>
<main>
{{ content }}
</main>
<footer class="site-footer">
  <p>Compiled automatically each day. Every item links to its source — always read the primary paper before changing practice.</p>
</footer>
</body>
</html>
